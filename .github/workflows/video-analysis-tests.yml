name: Video analysis tests

on:
  push:
    branches:
      - video-analysis-endpoint-timing
  pull_request:
    paths:
      - "video_post_processing/**"
      - ".github/workflows/video-analysis-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install video-analysis dependencies
        run: python -m pip install -r video_post_processing/requirements-video.txt
      - name: Compile analyzer
        run: python -m py_compile video_post_processing/Video_post_process_video_timing_v5.py
      - name: Run endpoint timing regression tests
        run: python video_post_processing/test_motion_detector.py
